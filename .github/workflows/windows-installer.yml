name: Windows-Installer

on:
  workflow_dispatch:
  push:
    branches: [klangwerk-windows-build]

permissions:
  contents: read

jobs:
  setup:
    name: Setup.exe bauen
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python 3.12 x64 bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-windows.txt
            packaging/requirements-ai.txt

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte nicht installiert werden." }
          }

      - name: Tests ausführen und Windows-Installer bauen
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Installer und Prüfsumme prüfen
        shell: pwsh
        run: |
          $setup = "dist/installer/Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe wurde nicht erzeugt." }
          if ((Get-Item $setup).Length -lt 1MB) { throw "Setup.exe ist unerwartet klein." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Setup.exe" | Set-Content -Encoding ascii dist/installer/Setup.exe.sha256
          @"
          Klangwerk 0.2.1 – korrigierte Entwicklungsfassung für Windows 11 x64
          Setup.exe starten. Python wird mitgeliefert.
          Die Einrichtung des KI-Modells erfolgt anschließend in der Anwendung.
          Physische Audiohardware und Aufnahme-Latenz sind noch nicht abgenommen.
          "@ | Set-Content -Encoding utf8 dist/installer/LIESMICH.txt

      - name: Gebaute EXE ohne Python-Umgebung starten und prüfen
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $PWD "dist/installer/Starttest.json"
          $exe = Join-Path $PWD "dist/Klangwerk/Klangwerk.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $report) -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Die EXE hat den Starttest nicht innerhalb von zwei Minuten beendet."
          }
          if (-not (Test-Path $report)) { throw "Die EXE hat keinen Starttestbericht erzeugt." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            Get-Content $report
            throw "Der Starttest der gebauten EXE ist fehlgeschlagen."
          }

      - name: Installer ausführen und echtes Modell in installierter EXE offline prüfen
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'Klangwerk-Installation'
          $data = Join-Path $env:LOCALAPPDATA 'KlangwerkLocal/Klangwerk'
          New-Item -ItemType Directory -Force $data | Out-Null
          $sentinel = Join-Path $data 'upgrade-preservation.txt'
          'Vorhandene Nutzerdaten muessen erhalten bleiben.' | Set-Content $sentinel
          $before = (Get-FileHash $sentinel).Hash
          $setup = Join-Path $PWD 'dist/installer/Setup.exe'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$install") -PassThru
          if (-not $installer.WaitForExit(180000)) { $installer.Kill(); throw 'Installer-Timeout.' }
          if ($installer.ExitCode -ne 0) { throw 'Installer fehlgeschlagen.' }
          if ((Get-FileHash $sentinel).Hash -ne $before) { throw 'Nutzerdaten wurden verändert.' }
          $model = Join-Path $PWD '.build-models/955717e8-8726e21a.th'
          $report = Join-Path $PWD 'dist/installer/Modelltest.json'
          $exe = Join-Path $install 'Klangwerk.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--model-test', $model, $report) -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Modelltest-Timeout.' }
          if (-not (Test-Path $report)) { throw 'Kein Modelltestbericht erzeugt.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok -or -not $result.weights_only -or -not $result.network_connect_forbidden) {
            Get-Content $report
            throw 'Echtes Modell konnte in der installierten EXE nicht sicher offline verarbeitet werden.'
          }

      - name: Setup.exe zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Klangwerk-Windows-Setup
          path: |
            dist/installer/Setup.exe
            dist/installer/Setup.exe.sha256
            dist/installer/LIESMICH.txt
            dist/installer/Starttest.json
            dist/installer/Modelltest.json
          if-no-files-found: error
          retention-days: 14
