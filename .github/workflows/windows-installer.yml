name: Windows-Installer

on:
  workflow_dispatch:
  push:
    branches: [klangwerk-windows-build]

permissions:
  contents: read

jobs:
  setup:
    name: Setup.exe bauen
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python 3.12 x64 bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-windows.txt
            packaging/requirements-ai.txt

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte nicht installiert werden." }
          }

      - name: Tests ausführen und Windows-Installer bauen
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Installer und Prüfsumme prüfen
        shell: pwsh
        run: |
          $setup = "dist/installer/Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe wurde nicht erzeugt." }
          if ((Get-Item $setup).Length -lt 1MB) { throw "Setup.exe ist unerwartet klein." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Setup.exe" | Set-Content -Encoding ascii dist/installer/Setup.exe.sha256
          @"
          Klangwerk 0.2 – Entwicklungsfassung für Windows 11 x64
          Setup.exe starten. Python wird mitgeliefert.
          Die Einrichtung des KI-Modells erfolgt anschließend in der Anwendung.
          Physische Audiohardware und Aufnahme-Latenz sind noch nicht abgenommen.
          "@ | Set-Content -Encoding utf8 dist/installer/LIESMICH.txt

      - name: Setup.exe zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Klangwerk-Windows-Setup
          path: |
            dist/installer/Setup.exe
            dist/installer/Setup.exe.sha256
            dist/installer/LIESMICH.txt
          if-no-files-found: error
          retention-days: 14
