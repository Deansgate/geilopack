name: Windows-Build-Sicherheitsvergleich
on:
  workflow_dispatch:
  push:
    branches: [klangwerk-security-audit]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Statisches PE-Analysewerkzeug installieren
        run: python -m pip install pefile==2023.2.7 pyinstaller==6.12.0
      - name: Alte und neue veröffentlichte Builds prüfen
        shell: pwsh
        run: ./packaging/audit-windows-builds.ps1
      - name: Prüfberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Klangwerk-Sicherheitsvergleich
          path: |
            security-audit/**/*.json
            security-audit/**/*.log
          if-no-files-found: warn
          retention-days: 30
